# Predictions whose p(crack) falls inside this band are routed to manual review
# instead of being auto-decided. Two-sided on purpose: 0.52 and 0.48 are equally
# uncertain, and a one-sided floor would only catch one of them.
#
# Tuned on the validation split, not guessed. Regenerate with:
#   python -m sentinelinspect.evaluation.evaluate split=val
lower: 0.35
upper: 0.65
